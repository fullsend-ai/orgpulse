# gitleaks configuration: default rules plus allowlists for known test fixtures.
[extend]
useDefault = true

[[allowlists]]
description = "Fixed fake API key used by tests"
regexes = ['''^test-api-key-12345$''']

[[allowlists]]
description = "TLS fixtures generated by make e2e-tls-fixtures (gitignored)"
paths = ['''^internal/database/testdata/tls/''']
