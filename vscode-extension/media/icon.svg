<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0f172a"/>
  <!-- Lake shape at bottom -->
  <ellipse cx="64" cy="90" rx="40" ry="14" fill="url(#lake)" opacity="0.8"/>
  <ellipse cx="64" cy="88" rx="36" ry="10" fill="#60a5fa" opacity="0.3"/>
  <!-- Pipeline nodes -->
  <!-- Top node (input) -->
  <circle cx="64" cy="28" r="8" fill="url(#flow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="32" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a" font-family="sans-serif">JS</text>
  <!-- Middle-left node (SQL) -->
  <circle cx="38" cy="55" r="8" fill="url(#flow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="38" y="58.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f172a" font-family="sans-serif">SQL</text>
  <!-- Middle-right node (SQL) -->
  <circle cx="90" cy="55" r="8" fill="url(#flow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="90" y="58.5" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f172a" font-family="sans-serif">SQL</text>
  <!-- Bottom node (output) -->
  <circle cx="64" cy="72" r="8" fill="url(#flow)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="64" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a" font-family="sans-serif">JS</text>
  <!-- Flow lines -->
  <line x1="58" y1="34" x2="42" y2="49" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="70" y1="34" x2="86" y2="49" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="60" x2="58" y2="67" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="84" y1="60" x2="70" y2="67" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Flow arrow down to lake -->
  <line x1="64" y1="80" x2="64" y2="83" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <polygon points="60,83 64,88 68,83" fill="#60a5fa" opacity="0.6"/>
</svg>
